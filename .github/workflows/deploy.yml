name: Deploy Personal OS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            cd /var/www/personal-os
            git fetch --all
            git reset --hard origin/main
            npm install
            npx drizzle-kit push
            npm run build
            NODE_OPTIONS="--dns-result-order=ipv4first" pm2 restart personal-os || NODE_OPTIONS="--dns-result-order=ipv4first" pm2 start npm --name "personal-os" -- start
            pm2 save
